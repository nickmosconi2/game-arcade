<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>X-ray Viewer</title>
<style>
  :root { --bg:#0b0f14; --panel:rgba(16,22,30,.88); --line:#243040; --text:#e6edf5; --dim:#8a9bb0; --accent:#4cc2ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px/1.35 -apple-system, system-ui, "Segoe UI", sans-serif; overflow:hidden; overscroll-behavior:none; }
  #stage { position:fixed; inset:0; touch-action:none; background:#000; }
  #video, #c2d, #c3d { position:absolute; inset:0; width:100%; height:100%; display:none; }
  #video { object-fit:cover; }
  header { position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:8px; padding:8px 10px; background:linear-gradient(#000a, #0000); z-index:5; }
  header .title { flex:1; min-width:0; }
  header b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header small { color:var(--dim); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  button, select { font:inherit; color:var(--text); background:#1a2430; border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
  button.on { background:var(--accent); border-color:var(--accent); color:#04121c; font-weight:600; }
  button:disabled { opacity:.4; }
  #bottom { position:fixed; left:0; right:0; bottom:0; z-index:5; background:var(--panel); border-top:1px solid var(--line); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); padding-bottom:env(safe-area-inset-bottom); }
  #tabs { display:flex; }
  #tabs button { flex:1; border:0; border-radius:0; background:none; padding:12px 4px; color:var(--dim); border-top:2px solid transparent; }
  #tabs button.on { color:var(--accent); border-top-color:var(--accent); background:none; }
  #panel { padding:8px 12px 4px; max-height:38vh; overflow:auto; }
  #panel.closed > .ctl { display:none; }
  #panelToggle { display:block; width:100%; border:0; background:none; color:var(--dim); padding:2px; font-size:12px; }
  .ctl { display:none; }
  .row { display:flex; align-items:center; gap:8px; margin:6px 0; flex-wrap:wrap; }
  .row label { width:64px; color:var(--dim); font-size:13px; flex:none; }
  .row input[type=range] { flex:1; min-width:120px; accent-color:var(--accent); }
  .row output { width:52px; text-align:right; color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chips button { padding:6px 10px; font-size:13px; }
  #status { position:fixed; left:10px; right:10px; top:58px; z-index:4; text-align:center; pointer-events:none; }
  #status span { display:inline-block; background:#000b; border-radius:8px; padding:5px 10px; font-size:13px; color:#cfe6ff; }
  #status span:empty { display:none; }
  #sheet { position:fixed; inset:0; z-index:10; background:#000c; display:flex; align-items:flex-end; justify-content:center; }
  #sheet.hidden, #busy.hidden { display:none; }
  #sheet .card { background:#111924; border:1px solid var(--line); border-radius:16px 16px 0 0; width:min(560px,100%); max-height:92vh; overflow:auto; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .card h2 { margin:0 0 4px; font-size:18px; }
  .card p { margin:4px 0 12px; color:var(--dim); font-size:13px; }
  .card .opt { display:block; width:100%; text-align:left; margin:8px 0; padding:12px; }
  .card .opt small { display:block; color:var(--dim); }
  #busy { position:fixed; inset:0; z-index:20; background:#000a; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  #err { color:#ffb4a8; font-size:13px; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="c2d"></canvas>
  <canvas id="c3d"></canvas>
</div>
<header>
  <div class="title"><b id="title">X-ray Viewer</b><small id="subtitle">No scan loaded</small></div>
  <select id="seriesSel" hidden></select>
  <button id="openBtn">Load</button>
</header>
<div id="status"><span id="statusText"></span></div>

<div id="bottom">
  <div id="panel">
    <button id="panelToggle">▾ controls</button>
    <div class="ctl" data-for="2d">
      <div class="row" id="sliceRow"><label>Slice</label><input type="range" id="slice" min="0" max="0" value="0"><output id="sliceOut"></output></div>
      <div class="row"><label>Preset</label><div class="chips" id="presets"></div></div>
      <div class="row"><label>Level</label><input type="range" id="wc"><output id="wcOut"></output></div>
      <div class="row"><label>Window</label><input type="range" id="ww"><output id="wwOut"></output></div>
    </div>
    <div class="ctl" data-for="3d cam">
      <div class="row"><label>Show</label><div class="chips" id="layers"></div></div>
      <div class="row"><label>Opacity</label><input type="range" id="opacity" min="10" max="100" value="100"><output id="opacityOut"></output></div>
    </div>
    <div class="ctl" data-for="cam">
      <div class="row"><label>Tracking</label><div class="chips">
        <button id="followBtn" class="on">Follow my arm</button>
        <button id="flipBtn">Flip ends</button>
        <button id="mirrorBtn">Mirror</button>
        <button id="resetBtn">Reset</button>
      </div></div>
      <div class="row"><label>Twist</label><input type="range" id="roll" min="-180" max="180" value="0"><output id="rollOut"></output></div>
      <div class="row"><label>Slide</label><input type="range" id="slide" min="-200" max="200" value="0"><output id="slideOut"></output></div>
      <div class="row"><label>Size</label><input type="range" id="size" min="50" max="200" value="100"><output id="sizeOut"></output></div>
    </div>
  </div>
  <div id="tabs">
    <button data-mode="2d" class="on">Slices</button>
    <button data-mode="3d">3D</button>
    <button data-mode="cam">X-ray vision</button>
  </div>
</div>

<div id="sheet">
  <div class="card">
    <h2>Load a scan</h2>
    <p>Files stay on this device. For viewing and experimenting only, not for diagnosis.</p>
    <button class="opt" data-sample="samples/phantom-forearm-ct.zip" data-slide="70">Demo forearm CT<small>Synthetic, life-size. Best one for trying X-ray vision.</small></button>
    <button class="opt" data-sample="samples/phantom-forearm-xray.dcm" data-slide="70">Demo forearm X-ray<small>Synthetic 2D film of the same arm.</small></button>
    <button class="opt" data-sample="samples/real-torso-ct-lite.zip">Real CT: torso<small>Human whole-body CT at half resolution, 11 MB.</small></button>
    <button class="opt" data-sample="samples/real-xray-ankle.dcm">Real X-ray: ankle<small>Human radiograph, 6 MB.</small></button>
    <button class="opt" id="pickBtn">Open my own DICOM files…<small>Pick every file of a series, or one .zip of the folder.</small></button>
    <input type="file" id="file" multiple hidden>
    <div id="err"></div>
    <button class="opt" id="closeSheet" hidden style="text-align:center">Cancel</button>
  </div>
</div>
<div id="busy" class="hidden"><div id="busyText">Loading…</div></div>
<script type="module" src="app.js"></script>
</body>
</html>
