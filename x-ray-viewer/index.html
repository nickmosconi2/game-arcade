<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>X-ray Viewer</title>
<style>
  :root { --line:#ffffff22; --text:#f2f5f8; --dim:#a9b4c0; --accent:#6fd0ff; --glass:rgba(12,16,22,.55); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html, body { margin:0; height:100%; background:#000; color:var(--text); font:15px/1.35 -apple-system, system-ui, "Segoe UI", sans-serif; overflow:hidden; overscroll-behavior:none; }
  #stage { position:fixed; inset:0; touch-action:none; background:#000; }
  #video, #c2d, #c3d { position:absolute; inset:0; width:100%; height:100%; display:none; }
  #video { object-fit:cover; }
  button { font:inherit; color:var(--text); background:var(--glass); border:1px solid var(--line); border-radius:999px; padding:7px 13px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  button.on { background:var(--accent); border-color:var(--accent); color:#03131d; font-weight:600; }
  #top { position:fixed; top:0; left:0; right:0; z-index:5; display:flex; align-items:center; gap:8px; padding:calc(8px + env(safe-area-inset-top)) 10px 8px; pointer-events:none; }
  #top > * { pointer-events:auto; }
  #modes { display:flex; background:var(--glass); border:1px solid var(--line); border-radius:999px; padding:2px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  #modes button { border:0; background:none; padding:6px 12px; font-size:13px; color:var(--dim); backdrop-filter:none; -webkit-backdrop-filter:none; }
  #modes button.on { background:#ffffff26; color:#fff; font-weight:600; }
  #title { flex:1; min-width:0; font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 3px #000; pointer-events:none; }
  #openBtn { font-size:13px; }
  #hint { position:fixed; left:0; right:0; bottom:calc(26px + env(safe-area-inset-bottom)); z-index:4; text-align:center; pointer-events:none; padding:0 20px; transition:opacity .35s; }
  #hint span { display:inline-block; background:var(--glass); border:1px solid var(--line); border-radius:18px; padding:8px 16px; font-size:14px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  #hint.off { opacity:0; }
  #layerBtn { position:fixed; right:12px; top:calc(56px + env(safe-area-inset-top)); z-index:6; font-size:13px; display:none; }
  #panel { position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:5; display:none; background:var(--glass); border:1px solid var(--line); border-radius:16px; padding:8px 12px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .row { display:flex; align-items:center; gap:10px; margin:4px 0; }
  .row input[type=range] { flex:1; min-width:0; accent-color:var(--accent); }
  .row output { width:54px; text-align:right; color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chips button { padding:5px 11px; font-size:13px; backdrop-filter:none; -webkit-backdrop-filter:none; background:#ffffff14; }
  .chips button.on { background:var(--accent); }
  #sheet { position:fixed; inset:0; z-index:10; background:#000d; display:flex; align-items:flex-end; justify-content:center; }
  #sheet.hidden, #busy.hidden { display:none; }
  #sheet .card { background:#10161e; border:1px solid var(--line); border-radius:20px 20px 0 0; width:min(560px,100%); max-height:92vh; overflow:auto; padding:18px 16px calc(16px + env(safe-area-inset-bottom)); }
  .card h2 { margin:0 0 4px; font-size:19px; }
  .card p { margin:4px 0 12px; color:var(--dim); font-size:13px; }
  .card .opt { display:block; width:100%; text-align:left; margin:8px 0; padding:12px 14px; border-radius:14px; background:#ffffff0f; backdrop-filter:none; -webkit-backdrop-filter:none; }
  .card .opt.main { background:var(--accent); color:#03131d; border-color:var(--accent); font-weight:600; }
  .card .opt small { display:block; color:var(--dim); font-weight:400; }
  .card .opt.main small { color:#03131dcc; }
  #busy { position:fixed; inset:0; z-index:20; background:#000b; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  #err { color:#ffb4a8; font-size:13px; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="c2d"></canvas>
  <canvas id="c3d"></canvas>
</div>

<div id="top">
  <div id="modes">
    <button data-mode="cam" class="on">X-ray</button>
    <button data-mode="3d">3D</button>
    <button data-mode="2d">Slices</button>
  </div>
  <div id="title"></div>
  <button id="openBtn">Load</button>
</div>

<div id="hint" class="off"><span id="hintText"></span></div>
<button id="layerBtn">Bones only</button>

<div id="panel">
  <div data-for="2d">
    <div class="row" id="sliceRow"><input type="range" id="slice" min="0" max="0" value="0"><output id="sliceOut"></output></div>
    <div class="row"><div class="chips" id="presets"></div></div>
  </div>
  <div data-for="3d">
    <div class="row"><div class="chips" id="layers"></div></div>
  </div>
</div>

<div id="sheet">
  <div class="card">
    <h2>Load a scan</h2>
    <p>Then point the camera at that part of your body. Files stay on this device. Not for diagnosis.</p>
    <button class="opt main" id="pickBtn">Open my DICOM files<small>Pick every file of the series, or one .zip of the folder.</small></button>
    <button class="opt" data-sample="samples/phantom-forearm-ct.zip">Demo: forearm and hand CT<small>Synthetic, life-size. Use it to try X-ray vision on your own arm.</small></button>
    <button class="opt" data-sample="samples/phantom-forearm-xray.dcm">Demo: forearm X-ray<small>Synthetic flat film of the same arm.</small></button>
    <button class="opt" data-sample="samples/real-torso-ct-lite.zip">Real CT: torso<small>Human whole-body CT, 11 MB. 3D and slices only for now.</small></button>
    <button class="opt" data-sample="samples/real-xray-ankle.dcm">Real X-ray: ankle<small>Human radiograph, 6 MB. Slices only for now.</small></button>
    <input type="file" id="file" multiple hidden>
    <div id="err"></div>
    <button class="opt" id="closeSheet" hidden style="text-align:center">Cancel</button>
  </div>
</div>
<div id="busy" class="hidden"><div id="busyText">Loading…</div></div>
<script type="module" src="app.js"></script>
</body>
</html>
