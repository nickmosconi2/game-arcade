<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>X-ray Vision</title>
<style>
  :root { --line:#ffffff26; --text:#f2f5f8; --dim:#b3bdc8; --accent:#6fd0ff; --glass:rgba(10,14,20,.55); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html, body { margin:0; height:100%; background:#000; color:var(--text); font:15px/1.35 -apple-system, system-ui, "Segoe UI", sans-serif; overflow:hidden; overscroll-behavior:none; }
  #stage { position:fixed; inset:0; touch-action:none; background:#000; }
  #video, #c2d, #c3d { position:absolute; inset:0; width:100%; height:100%; display:none; }
  #video { object-fit:cover; }
  #stage.mirror > video, #stage.mirror > canvas { transform:scaleX(-1); }
  button { font:inherit; color:var(--text); background:var(--glass); border:1px solid var(--line); border-radius:999px; padding:7px 13px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  button.on { background:var(--accent); border-color:var(--accent); color:#03131d; font-weight:600; }
  #top { position:fixed; top:0; left:0; right:0; z-index:6; display:flex; align-items:center; gap:8px; padding:calc(8px + env(safe-area-inset-top)) 10px 8px; pointer-events:none; }
  #top > * { pointer-events:auto; }
  #modes { display:flex; background:var(--glass); border:1px solid var(--line); border-radius:999px; padding:2px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  #modes button { border:0; background:none; padding:6px 11px; font-size:13px; color:var(--dim); backdrop-filter:none; -webkit-backdrop-filter:none; }
  #modes button.on { background:#ffffff26; color:#fff; font-weight:600; }
  #title { flex:1; min-width:0; font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 1px 3px #000; pointer-events:none; }
  #openBtn { font-size:13px; }

  /* The X-ray window */
  #box { position:fixed; z-index:3; pointer-events:none; display:none; }
  #box .c { position:absolute; width:26px; height:26px; border:3px solid #ffffffe0; filter:drop-shadow(0 1px 3px #0008); }
  #box .tl { left:-2px; top:-2px; border-right:0; border-bottom:0; border-top-left-radius:10px; }
  #box .tr { right:-2px; top:-2px; border-left:0; border-bottom:0; border-top-right-radius:10px; }
  #box .bl { left:-2px; bottom:-2px; border-right:0; border-top:0; border-bottom-left-radius:10px; }
  #box .br { right:-2px; bottom:-2px; border-left:0; border-top:0; border-bottom-right-radius:10px; }
  #box .edge { position:absolute; inset:0; border:1px solid #ffffff2a; border-radius:10px; box-shadow:0 0 0 200vmax rgba(0,0,0,.22); }
  #region { position:absolute; left:0; right:0; top:100%; margin-top:10px; text-align:center; }
  #region span { display:inline-block; background:var(--glass); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:14px; font-weight:600; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  #region span:empty { display:none; }
  #labels { position:fixed; inset:0; z-index:4; pointer-events:none; }
  .lbl { position:absolute; transform:translate(-50%,-50%); white-space:nowrap; font-size:12px; font-weight:600; color:#fff; text-shadow:0 1px 3px #000, 0 0 8px #000; transition:opacity .2s; }
  .lbl[data-kind=artery]::before { background:#ff5a5a !important; } .lbl[data-kind=vein]::before { background:#6c8cff !important; } .lbl[data-kind=muscle]::before { background:#ff9a7a !important; }
  .lbl::before { content:''; display:inline-block; width:7px; height:7px; border-radius:50%; background:#f3e9cf; box-shadow:0 0 0 2px #03131d; margin-right:6px; vertical-align:1px; }

  #hint { position:fixed; left:0; right:0; top:calc(58px + env(safe-area-inset-top)); z-index:5; text-align:center; pointer-events:none; padding:0 20px; transition:opacity .35s; }
  #hint span { display:inline-block; background:var(--glass); border:1px solid var(--line); border-radius:18px; padding:8px 16px; font-size:14px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  #hint.off { opacity:0; }
  #lock { position:fixed; left:12px; top:calc(58px + env(safe-area-inset-top)); z-index:5; font-size:12px; color:var(--dim); text-shadow:0 1px 3px #000; display:none; }
  #lock b { color:#7dffb0; }

  #dock { position:fixed; left:0; right:0; bottom:calc(30px + env(safe-area-inset-bottom)); z-index:6; display:none; align-items:center; justify-content:center; gap:14px; }
  #xrayBtn { width:74px; height:74px; border-radius:50%; padding:0; font-size:12px; font-weight:700; letter-spacing:.02em; border:3px solid #ffffffcc; background:#ffffff22; }
  #xrayBtn.on { background:var(--accent); color:#03131d; border-color:#fff; box-shadow:0 0 22px #6fd0ffaa; }
  #styleBtn, #layerBtn { font-size:13px; min-width:100px; }
  #sideBtn { font-size:13px; }
  #credit { position:fixed; left:0; right:0; bottom:calc(2px + env(safe-area-inset-bottom)); z-index:5; text-align:center; font-size:10px; color:#ffffff88; pointer-events:none; text-shadow:0 1px 2px #000; }

  #panel { position:fixed; left:10px; right:10px; bottom:calc(14px + env(safe-area-inset-bottom)); z-index:5; display:none; background:var(--glass); border:1px solid var(--line); border-radius:16px; padding:8px 12px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .row { display:flex; align-items:center; gap:10px; margin:4px 0; }
  .row input[type=range] { flex:1; min-width:0; accent-color:var(--accent); }
  .row output { width:54px; text-align:right; color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chips button { padding:5px 11px; font-size:13px; backdrop-filter:none; -webkit-backdrop-filter:none; background:#ffffff14; }
  .chips button.on { background:var(--accent); }

  #sheet { position:fixed; inset:0; z-index:10; background:#000d; display:flex; align-items:flex-end; justify-content:center; }
  #sheet.hidden, #busy.hidden { display:none; }
  #sheet .card { background:#10161e; border:1px solid var(--line); border-radius:20px 20px 0 0; width:min(560px,100%); max-height:92vh; overflow:auto; padding:18px 16px calc(16px + env(safe-area-inset-bottom)); }
  .card h2 { margin:0 0 4px; font-size:19px; }
  .card p { margin:4px 0 12px; color:var(--dim); font-size:13px; }
  .card .opt { display:block; width:100%; text-align:left; margin:8px 0; padding:12px 14px; border-radius:14px; background:#ffffff0f; backdrop-filter:none; -webkit-backdrop-filter:none; }
  .card .opt.main { background:var(--accent); color:#03131d; border-color:var(--accent); font-weight:600; }
  .card .opt small { display:block; color:var(--dim); font-weight:400; }
  .card .opt.main small { color:#03131dcc; }
  #busy { position:fixed; inset:0; z-index:20; background:#000b; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  #err { color:#ffb4a8; font-size:13px; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="c2d"></canvas>
  <canvas id="c3d"></canvas>
</div>

<div id="box"><div class="edge"></div><div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div><div id="region"><span id="regionText"></span></div></div>
<div id="labels"></div>

<div id="top">
  <div id="modes">
    <button data-mode="cam" class="on">Camera</button>
    <button data-mode="3d">3D model</button>
  </div>
  <div id="title"></div>
  <button id="labelBtn" class="on" style="font-size:13px">Labels</button>
  <button id="flipBtn" aria-label="Switch camera" style="padding:6px 10px;line-height:0"><svg width="22" height="20" viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3l2-3h8l2 3h3v12H3z"/><path d="M8.5 13a3.6 3.6 0 0 1 6.3-2.4M15.5 13a3.6 3.6 0 0 1-6.3 2.4"/><path d="M15 8.5v2.2h-2.2M9 17.5v-2.2h2.2"/></svg></button>
</div>

<div id="hint" class="off"><span id="hintText"></span></div>
<div id="lock"><b>●</b> Locked on</div>

<div id="dock">
  <button id="xrayBtn">X-RAY</button>
  <button id="layerBtn">Bone only</button>
</div>
<div id="credit">Anatomy: BodyParts3D, © DBCLS, CC BY 4.0. A reference body, not your own. For learning, not diagnosis.</div>

<div id="panel">
  <div class="row"><div class="chips" id="chips"></div></div>
  <div class="row" style="font-size:12px;color:var(--dim)">Drag to turn, pinch to zoom.</div>
</div>

<div id="busy" class="hidden"><div id="busyText">Loading…</div></div>
<script type="module" src="app.js"></script>
</body>
</html>
